groups:
    Runtime: Local state, Solution data, requests, and scoped navigation.
    Action: Operations and navigation through buttons, links, and action menus.
    Display: Records, text, metadata, status, progress, and file previews.
    Form: Collecting and submitting input through forms and field components.
    Layouts: Arranging content, panels, navigation, dialogs, tabs, and steps.

components:
    Table:
        keywords: [records, rows, columns, data table, list, queue, sorting]
        guidance: Present dense records as rows. Keep selection and query state explicit; do not wrap each row in a Card.
    Form:
        introduction: Collects and submits named fields through the Solution runtime.
        keywords: [editing form, edit, create, submit, validation, fields]
        guidance: Inspect the submission contract and field names before wiring a form. Validate and authorize mutations on the server.
    TextInput:
        keywords: [search, filter, text field, string, input]
        guidance: Use a controlled value and callback when input changes affect local query state.
    Selector:
        keywords: [select, dropdown, choice, filter]
    MultiSelector:
        keywords: [multiple selection, choices, filter]
    Button:
        keywords: [action, approve, reject, save, submit]
        guidance: Return the asynchronous operation from onClick so automatic loading and duplicate-click prevention cover the request.
    Badge:
        keywords: [status, count, state]
        guidance: Use for counts or enumerated states, not decoration.
    Token:
        keywords: [tag, category, status, state]
    EmptyState:
        keywords: [empty list, no results, missing data]
    Hooks:
        introduction: React hooks for local state, synchronization, and loading Solution data.
        keywords: [state, loading, query, fetch, data, effect]
        guidance: Use controlled state for local interaction. Effects should synchronize with external systems, not duplicate derived state.
    Functions:
        introduction: Scoped Solution requests and navigation capabilities.
        keywords: [request, api, mutation, navigation, navigate, server]
        guidance: Requests and scoped navigation target the current Solution. External HTTP(S) navigation requires user activation. Server routes own authorization and business rules.
    Layout:
        keywords: [page, shell, panel, sidebar, header, footer]
    Stack:
        keywords: [spacing, horizontal, vertical, layout]
    Grid:
        keywords: [columns, layout, dashboard]
    MetadataList:
        keywords: [details, record, labeled values]
    Dialog:
        keywords: [modal, confirmation, confirm]
    Card:
        introduction: Groups dashboard widgets, gallery items, or settings sections.
        keywords: [widget, gallery, settings]
        guidance: Do not wrap dense lists or individual table rows in cards.
    Tabs:
        introduction: Switches between related content panels.
        keywords: [tabs, panels, sections]
    Menu:
        introduction: Groups side navigation and the selected section's content.
        keywords: [navigation, sidebar, sections]

patterns:
    - name: Data table
      description: Present searchable records using data-driven rows and explicit query state.
      keywords: [searchable table, searchable list, customer table, records list, data table, records]
      components: [Table, TextInput, Hooks, EmptyState]
      steps:
          - Load records with the documented Hooks API and keep search/filter state local.
          - Define Table columns and row actions using supported props; apply filtering or pagination on the server when needed.
          - Show an EmptyState when there are no matching records.
    - name: Editing form
      description: Collect intent through named fields and persist changes through a validated Solution route.
      keywords: [edit form, editing form, create form, form, record editor]
      components: [Form, TextInput, Selector, Functions]
      steps:
          - Inspect Form's submission contract and initialize fields from the record being edited.
          - Choose field components that match the server schema and use documented names and value contracts.
          - Submit to a Solution route that validates input and enforces authorization; display its documented success or error state.
    - name: Approval queue
      description: Show pending work and make the next authorized action clear.
      keywords: [approval, approval queue, approve, review queue, pending approvals]
      components: [Table, Badge, Button, Hooks, Functions]
      steps:
          - Load pending records with the documented Hooks API and display their states as Table rows with Badge values.
          - Add explicit approve/reject actions through Button callbacks and scoped requests.
          - Enforce transitions and permissions on the Solution server, then refresh the queue after a successful action.
