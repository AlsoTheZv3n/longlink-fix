[project]
name = "__PROJECT_NAME__"
version = "0.0.0"
description = "LongLink building project and construction phase demo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "fastapi",
  "longlink",
  "pydantic",
  "python-multipart",
  "sqlalchemy",
  "sqlmodel",
]

[tool.longlink]
environments = "src.envs:Env"

[dependency-groups]
dev = [
  "httpx2",
  "pytest",
  "ruff",
]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
preview = true
select = ["I", "ANN401", "B006", "E302", "E305", "DTZ", "PGH003", "RUF100", "S324", "S506"]

[tool.ruff.lint.isort]
no-sections = true
length-sort = true
split-on-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["."]
